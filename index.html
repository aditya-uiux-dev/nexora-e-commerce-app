<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA — Navbar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14171f;
        --ink-soft: #2b2f3a;
        --canvas: #f4f5f7;
        --surface: #ffffff;
        --signal: #ff5a36;
        --muted: #6b7280;
        --line: #e5e7eb;
        --font-display: "Space Grotesk", "Inter", sans-serif;
        --font-body: "Inter", sans-serif;
        --space-2: 1rem;
        --space-4: 2rem;
        --radius-full: 999px;
        --max-width: 1280px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--ink);
        background: var(--canvas);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }

      .container {
        max-width: var(--max-width);
        margin-inline: auto;
        padding-inline: 1.5rem;
      }
      @media (min-width: 1024px) {
        .container {
          padding-inline: var(--space-4);
        }
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(244, 245, 247, 0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .site-header__row {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        height: 80px;
      }
      .logo {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
        flex-shrink: 0;
      }
      .main-nav {
        display: none;
        align-items: center;
        gap: 1.75rem;
      }
      .main-nav a {
        font-size: 0.9rem;
        color: var(--ink-soft);
      }
      .main-nav a:hover {
        color: var(--ink);
      }

      .search-form {
        position: relative;
        display: none;
        flex: 1;
      }
      .search-form svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--muted);
        pointer-events: none;
      }
      .search-form input {
        width: 100%;
        height: 40px;
        border-radius: var(--radius-full);
        border: 1px solid var(--line);
        background: var(--surface);
        padding-left: 40px;
        padding-right: var(--space-2);
        font-size: 0.875rem;
        color: var(--ink);
      }
      .search-form input:focus {
        border-color: var(--ink);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        margin-left: auto;
        flex-shrink: 0;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--ink-soft);
      }
      .icon-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .icon-btn svg {
        width: 19px;
        height: 19px;
      }

      .cart-btn {
        position: relative;
      }
      .cart-count {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--signal);
        color: #fff;
        font-size: 0.6rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      @media (min-width: 768px) {
        .main-nav {
          display: flex;
        }
        .search-form {
          display: flex;
        }
        .search-toggle {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__row">
        <a href="#" class="logo">NEXORA</a>

        <nav class="main-nav" aria-label="Primary">
          <a href="#">Shop</a>
          <a href="#">Categories</a>
          <a href="#">Deals</a>
          <a href="#">New Arrivals</a>
        </nav>

        <form class="search-form" role="search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="search"
            placeholder="Search products, brands & categories..."
            aria-label="Search products"
          />
        </form>

        <div class="header-actions">
          <button class="icon-btn search-toggle" aria-label="Search">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <a class="icon-btn" href="#" aria-label="Wishlist">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0L12 7.6l-3-3c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8L12 19l8.8-8.6c1.6-1.6 1.6-4.2 0-5.8Z"
              />
            </svg>
          </a>
          <a class="icon-btn cart-btn" href="#" aria-label="Cart, 3 items">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 8h12l-1 12H7L6 8Z" />
              <path d="M9 8V6a3 3 0 0 1 6 0v2" />
            </svg>
            <span class="cart-count">3</span>
          </a>
          <a class="icon-btn" href="#" aria-label="Account">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" />
            </svg>
          </a>
        </div>
      </div>
    </header>
  </body>
</html>
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXORA — Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14171f;
        --ink-soft: #2b2f3a;
        --canvas: #f4f5f7;
        --signal: #ff5a36;
        --signal-dark: #e0431f;
        --muted: #6b7280;
        --line: #e5e7eb;
        --font-display: "Space Grotesk", "Inter", sans-serif;
        --font-body: "Inter", sans-serif;
        --space-1: 0.5rem;
        --space-2: 1rem;
        --space-3: 1.5rem;
        --space-4: 2rem;
        --space-6: 3rem;
        --space-8: 4rem;
        --space-10: 5rem;
        --radius-lg: 28px;
        --radius-full: 999px;
        --max-width: 1280px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--ink);
        background: var(--canvas);
      }
      h1 {
        font-family: var(--font-display);
        margin: 0;
        line-height: 1.15;
      }
      p {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      img {
        display: block;
        max-width: 100%;
      }

      .container {
        max-width: var(--max-width);
        margin-inline: auto;
        padding-inline: 1.5rem;
      }
      @media (min-width: 1024px) {
        .container {
          padding-inline: var(--space-4);
        }
      }

      /* ---------- Buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1);
        border: 1px solid transparent;
        border-radius: var(--radius-full);
        font-weight: 500;
        font-size: 0.875rem;
        padding: 0 var(--space-3);
        height: 44px;
        transition: background-color 150ms ease, border-color 150ms ease,
          color 150ms ease;
        background: none;
      }
      .btn-lg {
        height: 52px;
        padding: 0 var(--space-4);
        font-size: 1rem;
      }
      .btn-primary {
        background: var(--ink);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--ink-soft);
      }
      .btn-outline {
        background: transparent;
        color: var(--ink);
        border-color: var(--line);
      }
      .btn-outline:hover {
        border-color: var(--ink);
      }

      /* ---------- Hero ---------- */
      .hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-6);
        align-items: center;
        padding-block: var(--space-8) var(--space-10);
      }
      .hero__copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }
      .hero h1 {
        font-size: 2.25rem;
        font-weight: 700;
        max-width: 20ch;
      }
      .hero p {
        max-width: 34ch;
        font-size: 1.125rem;
        color: var(--muted);
      }
      .hero__actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        padding-top: 0.5rem;
      }
      .hero__media {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        aspect-ratio: 4 / 3;
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .hero__media > img {
        height: 100%;
        width: 100%;
        object-fit: cover;
      }
      .hero__media .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hero__media .stack img {
        height: 100%;
        object-fit: cover;
      }

      @media (min-width: 1024px) {
        .hero {
          grid-template-columns: 1fr 1fr;
        }
        .hero h1 {
          font-size: 3.5rem;
        }
        .hero__media {
          aspect-ratio: 1 / 1;
        }
      }
    </style>
  </head>
  <body>
    <section class="container hero">
      <div class="hero__copy">
        <h1>Everything you need. All in one place.</h1>
        <p>
          Discover products across fashion, electronics, home, beauty and more
          &mdash; curated and priced to make deciding easy.
        </p>
        <div class="hero__actions">
          <a href="#" class="btn btn-primary btn-lg">Shop now</a>
          <a href="#" class="btn btn-outline btn-lg">Explore categories</a>
        </div>
      </div>
      <div class="hero__media">
        <img src="https://picsum.photos/seed/nexora-hero-a/500/700" alt="" />
        <div class="stack">
          <img src="https://picsum.photos/seed/nexora-hero-b/500/340" alt="" />
          <img src="https://picsum.photos/seed/nexora-hero-c/500/340" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
