<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXORA — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14171f;
      --ink-soft: #2b2f3a;
      --canvas: #f4f5f7;
      --signal: #ff5a36;
      --signal-dark: #e0431f;
      --muted: #6b7280;
      --line: #e5e7eb;
      --font-display: "Space Grotesk", "Inter", sans-serif;
      --font-body: "Inter", sans-serif;
      --space-1: 0.5rem;
      --space-2: 1rem;
      --space-3: 1.5rem;
      --space-4: 2rem;
      --space-6: 3rem;
      --space-8: 4rem;
      --space-10: 5rem;
      --radius-lg: 28px;
      --radius-full: 999px;
      --max-width: 1280px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--canvas); }
    h1 { font-family: var(--font-display); margin: 0; line-height: 1.15; }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }

    .container { max-width: var(--max-width); margin-inline: auto; padding-inline: 1.5rem; }
    @media (min-width: 1024px) { .container { padding-inline: var(--space-4); } }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0 var(--space-3);
      height: 44px;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      background: none;
    }
    .btn-lg { height: 52px; padding: 0 var(--space-4); font-size: 1rem; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: var(--ink-soft); }
    .btn-outline { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn-outline:hover { border-color: var(--ink); }

    /* ---------- Hero ---------- */
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-6);
      align-items: center;
      padding-block: var(--space-8) var(--space-10);
    }
    .hero__copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-3);
    }
    .hero h1 {
      font-size: 2.25rem;
      font-weight: 700;
      max-width: 20ch;
    }
    .hero p {
      max-width: 34ch;
      font-size: 1.125rem;
      color: var(--muted);
    }
    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      padding-top: 0.5rem;
    }
    .hero__media {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .hero__media > img {
      height: 100%;
      width: 100%;
      object-fit: cover;
    }
    .hero__media .stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hero__media .stack img {
      height: 100%;
      object-fit: cover;
    }

    @media (min-width: 1024px) {
      .hero {
        grid-template-columns: 1fr 1fr;
      }
      .hero h1 { font-size: 3.5rem; }
      .hero__media { aspect-ratio: 1 / 1; }
    }
  </style>
</head>
<body>

  <section class="container hero">
    <div class="hero__copy">
      <h1>Everything you need. All in one place.</h1>
      <p>Discover products across fashion, electronics, home, beauty and more &mdash; curated and priced to make deciding easy.</p>
      <div class="hero__actions">
        <a href="#" class="btn btn-primary btn-lg">Shop now</a>
        <a href="#" class="btn btn-outline btn-lg">Explore categories</a>
      </div>
    </div>
    <div class="hero__media">
      <img src="https://picsum.photos/seed/nexora-hero-a/500/700" alt="" />
      <div class="stack">
        <img src="https://picsum.photos/seed/nexora-hero-b/500/340" alt="" />
        <img src="https://picsum.photos/seed/nexora-hero-c/500/340" alt="" />
      </div>
    </div>
  </section>

</body>
</html>
