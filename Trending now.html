<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14171f;
      --canvas: #f4f5f7;
      --surface: #ffffff;
      --signal: #ff5a36;
      --muted: #6b7280;
      --line: #e5e7eb;
      --success: #16a34a;
      --font-display: "Space Grotesk", "Inter", sans-serif;
      --font-body: "Inter", sans-serif;
      --space-1: 0.5rem;
      --space-2: 1rem;
      --space-3: 1.5rem;
      --space-4: 2rem;
      --space-8: 4rem;
      --radius-md: 20px;
      --radius-full: 999px;
      --max-width: 1280px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--canvas); }
    h2, h3 { font-family: var(--font-display); margin: 0; }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }

    .container { max-width: var(--max-width); margin-inline: auto; padding-inline: 1.5rem; }
    @media (min-width: 1024px) { .container { padding-inline: var(--space-4); } }

    section { padding-block: var(--space-8); }

    .section-title { font-size: 1.5rem; font-weight: 600; }
    .section-sub { margin-top: 0.25rem; color: var(--muted); }

    /* ---------- Product grid ---------- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      column-gap: var(--space-3);
      row-gap: var(--space-4);
      margin-top: var(--space-4);
    }
    @media (min-width: 1024px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ---------- Product card ---------- */
    .product-card { display: flex; flex-direction: column; position: relative; }

    .product-card__media {
      position: relative;
      display: block;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .product-card__media img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 300ms ease;
    }
    .product-card:hover .product-card__media img { transform: scale(1.05); }

    .product-card__badges {
      position: absolute; top: 0.75rem; left: 0.75rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .badge {
      display: inline-flex; align-items: center;
      border-radius: var(--radius-full);
      padding: 0.35rem 0.7rem;
      font-size: 0.75rem; font-weight: 500;
    }
    .badge-sale { background: var(--signal); color: #fff; }
    .badge-out { background: var(--line); color: var(--muted); }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(255, 255, 255, 0.9); color: var(--ink);
      backdrop-filter: blur(4px);
    }
    .icon-btn:hover { background: #fff; }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn.is-active svg { fill: var(--signal); stroke: var(--signal); }

    .product-card__wishlist { position: absolute; top: 0.75rem; right: 0.75rem; }

    .product-card__add {
      position: absolute; bottom: 0.75rem; right: 0.75rem;
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--ink); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 200ms ease;
    }
    .product-card:hover .product-card__add { opacity: 1; }
    .product-card__add svg { width: 18px; height: 18px; }

    .product-card__quickadd {
      position: absolute; bottom: 0.75rem; left: 0.75rem; right: 3rem;
      display: inline-flex; align-items: center; justify-content: center;
      height: 34px; border-radius: var(--radius-full);
      background: var(--ink); color: #fff;
      font-size: 0.75rem; font-weight: 500; border: none;
      opacity: 0; transform: translateY(6px);
      transition: opacity 200ms ease, transform 200ms ease;
    }
    .product-card:hover .product-card__quickadd { opacity: 1; transform: translateY(0); }

    .product-card__body { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .product-card__brand { font-size: 0.75rem; color: var(--muted); }
    .product-card__name { font-size: 0.875rem; font-weight: 500; }

    .rating { display: flex; align-items: center; gap: 0.4rem; }
    .rating .stars { display: inline-flex; gap: 0.15rem; }
    .rating svg { width: 14px; height: 14px; }
    .rating svg.filled { fill: var(--signal); stroke: var(--signal); }
    .rating svg.empty { fill: var(--line); stroke: var(--line); }
    .rating .count { font-size: 0.75rem; color: var(--muted); }

    .product-card__price { display: flex; align-items: baseline; gap: 0.5rem; padding-top: 0.15rem; }
    .product-card__price .price { font-weight: 600; font-size: 0.9rem; }
    .product-card__price .original { font-size: 0.75rem; color: var(--muted); text-decoration: line-through; }
    .product-card__delivery { font-size: 0.75rem; color: var(--success); }
  </style>
</head>
