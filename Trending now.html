<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXORA — Trending Now</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #14171f;
      --canvas: #f4f5f7;
      --surface: #ffffff;
      --signal: #ff5a36;
      --muted: #6b7280;
      --line: #e5e7eb;
      --success: #16a34a;
      --font-display: "Space Grotesk", sans-serif;
      --font-body: "Inter", sans-serif;
      --space-1: 0.5rem;
      --space-2: 1rem;
      --space-3: 1.5rem;
      --space-4: 2rem;
      --space-8: 4rem;
      --radius-md: 20px;
      --radius-full: 999px;
      --max-width: 1280px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--canvas);
    }

    h2, h3, p {
      margin: 0;
    }

    h2, h3 {
      font-family: var(--font-display);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      max-width: var(--max-width);
      margin-inline: auto;
      padding-inline: 1.5rem;
    }

    section {
      padding-block: var(--space-8);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .section-sub {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--space-3);
      row-gap: var(--space-4);
      margin-top: var(--space-4);
    }

    @media (min-width: 1024px) {
      .container {
        padding-inline: var(--space-4);
      }

      .product-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* Product card */
    .product-card {
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .product-card__media {
      position: relative;
      display: block;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: #e9e9e9;
    }

    .product-card__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 300ms ease;
    }

    .product-card:hover .product-card__media img {
      transform: scale(1.05);
    }

    .product-card__badges {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-full);
      padding: 0.4rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge-sale {
      background: var(--signal);
      color: white;
    }

    .badge-out {
      background: #fff;
      color: var(--muted);
    }

    /* Wishlist button */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      backdrop-filter: blur(4px);
    }

    .icon-btn:hover {
      background: white;
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
    }

    .icon-btn.is-active svg {
      fill: var(--signal);
      stroke: var(--signal);
    }

    .product-card__wishlist {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
    }

    /* Add to cart */
    .product-card__add {
      position: absolute;
      bottom: 0.75rem;
      right: 0.75rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--ink);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .product-card:hover .product-card__add {
      opacity: 1;
    }

    .product-card__add svg {
      width: 18px;
      height: 18px;
    }

    .product-card__quickadd {
      position: absolute;
      bottom: 0.75rem;
      left: 0.75rem;
      right: 3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      border-radius: var(--radius-full);
      background: var(--ink);
      color: white;
      font-size: 0.75rem;
      font-weight: 500;
      border: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .product-card:hover .product-card__quickadd {
      opacity: 1;
      transform: translateY(0);
    }

    /* Product information */
    .product-card__body {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .product-card__brand {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .product-card__name {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.15rem;
    }

    .rating .stars {
      display: inline-flex;
      gap: 0.12rem;
    }

    .rating svg {
      width: 14px;
      height: 14px;
    }

    .rating svg.filled {
      fill: var(--signal);
      stroke: var(--signal);
    }

    .rating svg.empty {
      fill: var(--line);
      stroke: var(--line);
    }

    .rating .count {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .product-card__price {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding-top: 0.15rem;
    }

    .product-card__price .price {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .product-card__price .original {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    .product-card__delivery {
      font-size: 0.75rem;
      color: var(--success);
    }

    /* Touchscreen devices */
    @media (hover: none) {
      .product-card__add,
      .product-card__quickadd {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 420px) {
      .container {
        padding-inline: 1rem;
      }

      .product-grid {
        column-gap: 0.8rem;
        row-gap: 1.5rem;
      }

      .product-card__name {
        font-size: 0.82rem;
      }

      .product-card__media {
        border-radius: 14px;
      }

      .product-card__badges {
        top: 0.5rem;
        left: 0.5rem;
      }

      .badge {
        font-size: 0.65rem;
        padding: 0.3rem 0.5rem;
      }
    }
  </style>
</head>

<body>

    </div>
  </section>

  <script>
    // Wishlist interaction
    document.querySelectorAll(".product-card__wishlist").forEach((button) => {
      button.addEventListener("click", () => {
        const active = button.getAttribute("aria-pressed") === "true";
        button.setAttribute("aria-pressed", String(!active));
        button.classList.toggle("is-active", !active);
      });
    });
  </script>
</body>
</html>
